name: WPU HTTP authentication release gates
on:
  pull_request:
permissions:
  contents: read
jobs:
  auth-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_PILOT_ENABLED: 'false'
      TEST_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test actual HTTP routes with pilot disabled
        run: |
          set -euo pipefail
          npx next start -H 127.0.0.1 -p 3000 > /tmp/wpu-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true; cat /tmp/wpu-http.log' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/join > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/join > /dev/null
          node tests/auth-http-pilot-disabled.mjs
