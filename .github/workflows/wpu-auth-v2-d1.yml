name: WPU auth v2 isolated D1 security tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'database/wpu-passwordless-auth-v2.sql'
      - 'database/test-wpu-passwordless-auth-v2.sql'
      - '.github/workflows/wpu-auth-v2-d1.yml'
permissions:
  contents: read
jobs:
  auth-v2-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply migrations to isolated local D1
        run: |
          npx wrangler d1 execute wpu-supporters --local --file database/wpu-identity-foundation-v1.sql
          npx wrangler d1 execute wpu-supporters --local --file database/wpu-passwordless-auth-v1.sql
          npx wrangler d1 execute wpu-supporters --local --file database/wpu-passwordless-auth-v2.sql
      - name: Verify rate limits cooldown and challenge consumption
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute wpu-supporters --local --file database/test-wpu-passwordless-auth-v2.sql > /tmp/wpu-auth-v2-results.txt
          cat /tmp/wpu-auth-v2-results.txt
          grep -q RATE_LIMIT_PASS /tmp/wpu-auth-v2-results.txt
          grep -q COOLDOWN_REJECT_PASS /tmp/wpu-auth-v2-results.txt
          grep -q COOLDOWN_RENEW_PASS /tmp/wpu-auth-v2-results.txt
          grep -q CHALLENGE_CONSUMPTION_PASS /tmp/wpu-auth-v2-results.txt
          echo 'Auth v2 isolated D1 invariants passed; no production database touched.' >> "$GITHUB_STEP_SUMMARY"
