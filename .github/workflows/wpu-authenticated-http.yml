name: WPU authenticated Worker HTTP journey
on:
  pull_request:
permissions:
  contents: read
jobs:
  authenticated-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_CODE_PEPPER: synthetic-ci-only-pepper-not-for-production
      TEST_BASE_URL: http://localhost:8787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx opennextjs-cloudflare build
      - name: Prepare isolated local database
        run: |
          set -euo pipefail
          for file in wpu-identity-foundation-v1 wpu-identity-invariants-v1 wpu-passwordless-auth-v1 wpu-passwordless-auth-v2 wpu-passwordless-auth-v3 wpu-organisation-foundation-v2; do
            npx wrangler d1 execute wpu-supporters --local --file "database/$file.sql"
          done
          node tests/seed-auth-http.mjs > /tmp/wpu-seed.sql
          npx wrangler d1 execute wpu-supporters --local --file /tmp/wpu-seed.sql
      - name: Run authenticated HTTP journey
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip localhost --port 8787 --var AUTH_PILOT_ENABLED:true --var AUTH_CODE_PEPPER:"$AUTH_CODE_PEPPER" > /tmp/wpu-worker.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true; cat /tmp/wpu-worker.log' EXIT
          for i in $(seq 1 90); do
            if curl -fsS "$TEST_BASE_URL/join" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$TEST_BASE_URL/join" >/dev/null
          node tests/auth-http-authenticated.mjs
          node tests/seed-auth-returning.mjs > /tmp/wpu-returning.sql
          npx wrangler d1 execute wpu-supporters --local --file /tmp/wpu-returning.sql
          EXPECTED_PLAYER_CODE="$(cat /tmp/wpu-test-player-code)" node tests/auth-http-returning.mjs
