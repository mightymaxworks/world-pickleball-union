name: WPU Cloudflare deployment inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Inspect generated Cloudflare deployment artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "## Cloudflare deployment inspection" >> "$GITHUB_STEP_SUMMARY"
          echo "Repository Wrangler files:" >> "$GITHUB_STEP_SUMMARY"
          find . -maxdepth 3 -type f \( -name 'wrangler.toml' -o -name 'wrangler.json' -o -name 'wrangler.jsonc' \) -not -path './node_modules/*' -print | tee wrangler-files.txt
          echo 'Generated .open-next files:' >> "$GITHUB_STEP_SUMMARY"
          if [ -d .open-next ]; then find .open-next -maxdepth 3 -type f | head -40; else echo 'No .open-next output generated by npm run build'; fi
          echo 'Cloudflare deployment is NOT executed by this inspection.' >> "$GITHUB_STEP_SUMMARY"
      - name: Validate Wrangler dry-run without deploying
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/wpu-wrangler-inspection 2>&1 | tee wrangler-dry-run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wpu-cloudflare-inspection
          path: |
            wrangler-files.txt
            wrangler-dry-run.log
          if-no-files-found: ignore
