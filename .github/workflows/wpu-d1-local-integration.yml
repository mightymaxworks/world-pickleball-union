name: WPU local D1 pledge integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'database/**'
      - 'src/lib/supporters-db.ts'
      - 'src/app/api/supporters/pledge/**'
      - '.github/workflows/wpu-d1-local-integration.yml'
permissions:
  contents: read
jobs:
  d1-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Create isolated local D1 schema
        run: |
          npx wrangler d1 execute wpu-supporters --local --file database/supporters.sql
          npx wrangler d1 execute wpu-supporters --local --file database/supporters-review-migration.sql
      - name: Test pledge and audit data constraints locally
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wpu-d1-fixture.sql <<'SQL'
          INSERT INTO supporter_pledges
            (id,name,country,region,category,website,representative,email,status,authority_confirmed,publication_consent,created_at,verification_status,review_reason,policy_version)
          VALUES
            ('local-test-pledge','Local Test Club','Singapore','Asia','Clubs & Communities','https://example.org','Test Representative','test@example.org','pending',1,1,datetime('now'),'unverified','independent_verification_required','wpu-supporters-v1');
          INSERT INTO supporter_audit (id,pledge_id,action,actor,reason,policy_version)
          VALUES ('local-test-audit','local-test-pledge','submitted','system','independent_verification_required','wpu-supporters-v1');
          SELECT CASE WHEN
            (SELECT COUNT(*) FROM supporter_pledges WHERE id='local-test-pledge' AND status='pending' AND verification_status='unverified')=1
            AND (SELECT COUNT(*) FROM supporter_audit WHERE pledge_id='local-test-pledge' AND action='submitted')=1
            AND (SELECT COUNT(*) FROM supporter_pledges WHERE status='approved')=0
          THEN 'PASS' ELSE 'FAIL' END AS result;
          SQL
          npx wrangler d1 execute wpu-supporters --local --file /tmp/wpu-d1-fixture.sql > /tmp/wpu-d1-result.txt
          cat /tmp/wpu-d1-result.txt
          grep -q 'PASS' /tmp/wpu-d1-result.txt
          echo 'Local D1 schema and pending pledge/audit fixture: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'No production database or live API accessed.' >> "$GITHUB_STEP_SUMMARY"
