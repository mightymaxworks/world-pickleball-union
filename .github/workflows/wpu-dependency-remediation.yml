name: WPU dependency remediation candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Resolve compatible dependency updates
        run: npm audit fix --package-lock-only --omit=dev || true
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx --no-install opennextjs-cloudflare build
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-dependency-candidate
          path: |
            package.json
            package-lock.json
