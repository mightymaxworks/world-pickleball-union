name: Bhutan Event Studio organiser workspace
on:
  pull_request:
    paths:
      - .github/workflows/wpu-event-studio-bhutan-workspace.yml
      - scripts/wpu-event-studio-bhutan-release.sh
      - tests/run-event-studio-bhutan-preparation.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/wpu-event-studio-bhutan-workspace.yml
      - scripts/wpu-event-studio-bhutan-release.sh
permissions:
  contents: read
concurrency:
  group: wpu-production-d1
  cancel-in-progress: false
jobs:
  verify-and-prepare-bhutan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - if: github.event_name == 'pull_request'
        run: bash tests/run-event-studio-bhutan-preparation.sh
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          bash scripts/wpu-event-studio-bhutan-release.sh
