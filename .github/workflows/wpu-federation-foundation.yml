name: WPU multi-federation isolated D1 tests
on:
  pull_request:
    paths:
      - 'database/wpu-organisation-foundation-v2.sql'
      - 'database/test-wpu-organisation-foundation-v2.sql'
      - '.github/workflows/wpu-federation-foundation.yml'
permissions:
  contents: read
jobs:
  federation-d1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: |
          npx wrangler d1 execute wpu-supporters --local --file database/wpu-identity-foundation-v1.sql
          npx wrangler d1 execute wpu-supporters --local --file database/wpu-identity-invariants-v1.sql
          npx wrangler d1 execute wpu-supporters --local --file database/wpu-organisation-foundation-v2.sql
          npx wrangler d1 execute wpu-supporters --local --file database/test-wpu-organisation-foundation-v2.sql > /tmp/federation-result.txt
          cat /tmp/federation-result.txt
          grep -q FEDERATION_FOUNDATION_PASS /tmp/federation-result.txt
