name: Cloudflare OpenNext migration validation (no deploy)
on:
  push:
    branches:
      - chore/cloudflare-opennext-migration
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Cloudflare adapter in isolated runner
        run: npm install --no-save --package-lock=false next@16.4.5 @opennextjs/cloudflare@1.20.18 wrangler@4
      - name: Prepare isolated OpenNext configuration
        shell: bash
        run: |
          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          export default defineCloudflareConfig();
          EOF
      - name: Run adapter build without deploying
        shell: bash
        run: |
          set -euo pipefail
          npx opennextjs-cloudflare build --skipWranglerConfigCheck
          test -f .open-next/worker.js
          test -d .open-next/assets
      - name: Validate complete Wrangler configuration without deploying
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "world-pickleball-union",
            "main": ".open-next/worker.js",
            "compatibility_date": "2026-11-18",
            "compatibility_flags": ["nodejs_compat", "global_fetch_strictly_public"],
            "assets": {"directory": ".open-next/assets", "binding": "ASSETS"},
            "images": {"binding": "IMAGES"},
            "r2_buckets": [{"binding": "NEXT_INC_CACHE_R2_BUCKET", "bucket_name": "world-pickleball-union-opennext-cache"}],
            "services": [{"binding": "WORKER_SELF_REFERENCE", "service": "world-pickleball-union"}],
            "d1_databases": [{"binding": "WPU_DB", "database_name": "wpu-supporters", "database_id": "f245a594-0932-41b9-b255-aeaa1300b639"}]
          }
          EOF
          npx wrangler deploy --dry-run --outdir /tmp/wpu-deployment-check
      - name: Inspect generated output
        shell: bash
        run: |
          set -euo pipefail
          echo "## OpenNext generated deployment files" >> "$GITHUB_STEP_SUMMARY"
          find .open-next -maxdepth 2 -type f | head -40
          echo "No deployment was executed." >> "$GITHUB_STEP_SUMMARY"
