name: Pin OpenNext migration dependencies (branch only)
on:
  push:
    branches: [chore/cloudflare-opennext-migration]
    paths:
      - .github/workflows/wpu-pin-opennext.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pin:
    if: github.ref == 'refs/heads/chore/cloudflare-opennext-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Pin compatible framework and adapter versions
        run: |
          npm install --save-exact next@16.4.5 eslint-config-next@16.4.5
          npm install --save-dev --save-exact @opennextjs/cloudflare@1.20.18 wrangler@4.165.0
          npm ci
      - name: Commit package manifests to migration branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency manifests already pinned."
          else
            git commit -m "Pin compatible OpenNext Cloudflare dependencies and lockfile"
            git push origin HEAD:chore/cloudflare-opennext-migration
          fi
