name: WPU production affiliation schema
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wpu-production-affiliation-d1.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect or apply the two reviewed affiliation migrations
        type: choice
        default: inspect
        options: [inspect, apply]
      confirmation:
        description: Enter WPU-PRODUCTION for manual apply
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: wpu-production-d1
  cancel-in-progress: false
jobs:
  affiliation-migrations:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify and apply only the reviewed pilot migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if [[ "$EVENT" == push ]]; then
            MODE=apply
          elif [[ "$MODE" == apply && "$CONFIRMATION" != WPU-PRODUCTION ]]; then
            echo "::error::A manual apply requires WPU-PRODUCTION."
            exit 1
          fi
          bash scripts/wpu-affiliation-d1-release.sh "$MODE"
