name: WPU Event Studio schema
on:
  pull_request:
    paths:
      - .github/workflows/wpu-production-event-studio.yml
      - database/wpu-event-studio-v1.sql
      - database/wpu-event-sanction-v1.sql
      - database/wpu-event-entries-v1.sql
      - database/wpu-event-registration-setup-v1.sql
      - scripts/wpu-event-studio-release.sh
      - scripts/wpu-event-sanction-release.sh
      - scripts/wpu-event-entry-release.sh
      - tests/event-studio.test.mjs
      - tests/event-entries.test.mjs
      - src/lib/entries/**
      - src/lib/events/**
  push:
    branches: [main]
    paths:
      - .github/workflows/wpu-production-event-studio.yml
      - database/wpu-event-studio-v1.sql
      - database/wpu-event-sanction-v1.sql
      - database/wpu-event-entries-v1.sql
      - database/wpu-event-registration-setup-v1.sql
      - scripts/wpu-event-studio-release.sh
      - scripts/wpu-event-sanction-release.sh
      - scripts/wpu-event-entry-release.sh
permissions:
  contents: read
concurrency:
  group: wpu-production-d1
  cancel-in-progress: false
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: bash -n scripts/wpu-event-studio-release.sh && bash -n scripts/wpu-event-sanction-release.sh && bash -n scripts/wpu-event-entry-release.sh
      - run: node --experimental-strip-types --test tests/event-studio.test.mjs tests/event-entries.test.mjs
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          bash scripts/wpu-event-studio-release.sh prepare
          bash scripts/wpu-event-sanction-release.sh prepare
          bash scripts/wpu-event-entry-release.sh prepare
