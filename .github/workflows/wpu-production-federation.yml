name: WPU production federation preparation
on:
  pull_request:
    paths:
      - .github/workflows/wpu-production-federation.yml
      - scripts/wpu-federation-d1-release.sh
      - tests/run-federation-preparation.sh
      - database/wpu-federation-portal-v1.sql
  push:
    branches: [main]
    paths:
      - .github/workflows/wpu-production-federation.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect or prepare the Bhutan federation pilot without enabling it
        type: choice
        default: inspect
        options: [inspect, prepare]
      confirmation:
        description: Enter WPU-PRODUCTION for manual preparation
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: wpu-production-d1
  cancel-in-progress: false
jobs:
  isolated-release-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: bash tests/run-federation-preparation.sh
  prepare-bhutan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify and prepare the existing Bhutan federation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if [[ "$RELEASE_EVENT" == push ]]; then
            RELEASE_MODE=prepare
          elif [[ "$RELEASE_MODE" == prepare && "$RELEASE_CONFIRMATION" != WPU-PRODUCTION ]]; then
            echo "::error::Manual preparation requires WPU-PRODUCTION."
            exit 1
          fi
          bash scripts/wpu-federation-d1-release.sh "$RELEASE_MODE"
