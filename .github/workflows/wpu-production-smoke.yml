name: WPU production API smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public supporter directory
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 2 \
            -H 'Accept: application/json' \
            'https://worldpickleball.world/api/supporters' -o response.json
          node -e 'const d=require("./response.json");if(!Array.isArray(d.supporters)||d.error)process.exit(1);console.log("Supporter directory API healthy; records:",d.supporters.length)'
