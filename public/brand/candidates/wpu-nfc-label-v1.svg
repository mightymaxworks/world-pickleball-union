<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">WPU NFC verification label candidate</title><desc id="d">Non-functional label template with reserved verification area</desc><rect width="640" height="360" rx="30" fill="#0B2A66"/><rect x="14" y="14" width="612" height="332" rx="22" fill="none" stroke="#C6FF3D" stroke-width="7"/><text x="42" y="94" font-family="Arial,sans-serif" font-size="58" font-weight="900" fill="#fff">WPU</text><text x="42" y="140" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#C6FF3D">EQUIPMENT VERIFICATION</text><path d="M45 166H405" stroke="#fff" opacity=".35"/><text x="42" y="209" font-family="Arial,sans-serif" font-size="19" fill="#fff">Tap NFC or scan QR to check</text><text x="42" y="238" font-family="Arial,sans-serif" font-size="19" fill="#fff">the current certification record.</text><text x="42" y="305" font-family="Arial,sans-serif" font-size="16" fill="#C6FF3D">STATUS MUST BE CHECKED ONLINE</text><rect x="438" y="53" width="150" height="150" rx="12" fill="#fff"/><text x="513" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#0B2A66">QR</text><text x="513" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#0B2A66">RESERVED</text><text x="513" y="251" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#fff">NFC / QR</text><text x="513" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#fff">TEMPLATE</text></svg>